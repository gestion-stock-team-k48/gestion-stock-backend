# Intégration et livraison continues du backend.
#
# Trois temps : on vérifie, on analyse, on publie. Rien n'est publié qui n'ait passé les deux
# premiers — `needs` l'impose, et la publication ne se déclenche que sur les références qui
# désignent quelque chose de déployable.

# Les actions sont épinglées par empreinte de commit, avec leur version en commentaire.
# Un tag peut être redéplacé sur un autre commit sans que personne ne le voie : quiconque
# obtient les droits sur le dépôt d'une action peut alors changer ce qui s'exécute dans nos
# pipelines, avec accès aux secrets. Une empreinte, elle, ne bouge pas.
#
# Pour monter une version : lire l'empreinte du nouveau tag et remplacer les deux.
#     gh api repos/<propriétaire>/<dépôt>/git/ref/tags/<tag> --jq .object.sha

name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Un push qui en remplace un autre sur la même référence annule le précédent. Une exception
# pour les tags, dont l'annulation laisserait une version sans image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || 'mcjordan12' }}/gestion-stock-backend

jobs:
  # ── Qualité ────────────────────────────────────────────────────────────────────────────
  qualite:
    name: Compilation, tests, couverture
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL est démarré même si la suite actuelle est unitaire : le jour où un test
    # d'intégration arrive, il trouve une base sans qu'on retouche au pipeline. Le port est
    # celui de l'application, pas le 5433 du compose de développement.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gestion_stock_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # SonarCloud a besoin de l'historique complet pour attribuer les lignes neuves à
          # leur commit ; une copie superficielle lui ferait voir tout le dépôt comme neuf.
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # La distribution Maven que le wrapper télécharge n'est pas dans le cache de
      # `setup-java`, qui ne garde que `~/.m2/repository`. Sans ce cache, chaque job la
      # retire du réseau — et un pipeline qui tombe sur un aléa de téléchargement est un
      # pipeline qu'on finit par relancer sans lire.
      - name: Cache de la distribution Maven
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      # Première invocation, isolée et réessayée : elle ne fait que provoquer le
      # téléchargement. Le vrai travail part ensuite avec la distribution déjà en place.
      - name: Amorçage du wrapper
        run: |
          for tentative in 1 2 3; do
            if sh mvnw -B -N -q validate; then exit 0; fi
            echo "tentative $tentative échouée, nouvelle tentative dans 15 s"
            sleep 15
          done
          echo "le wrapper Maven n'a pas pu récupérer sa distribution"
          exit 1

      # MinIO ne peut pas être déclaré en `services` : l'image exige `server /data` en
      # argument, et un conteneur de service n'accepte pas qu'on lui change sa commande.
      #
      # Il est nécessaire, et pas seulement confortable : trois tests démarrent le contexte
      # Spring complet, donc `MinioFileStorageServiceImpl`, qui crée son bucket dans son
      # `@PostConstruct`. Sans serveur en face, le contexte ne se charge pas et six tests
      # tombent — ce sont des tests d'intégration, quand bien même rien dans leur nom ne le
      # dit.
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadminpassword \
            minio/minio:RELEASE.2024-01-18T22-51-28Z server /data
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO prêt"; exit 0
            fi
            sleep 2
          done
          echo "MinIO n'a pas démarré"; docker logs minio; exit 1

      # `verify` couvre `test` puis déclenche le rapport JaCoCo, attaché à cette phase.
      - name: Vérification et couverture
        env:
          DB_URL: jdbc:postgresql://localhost:5432/gestion_stock_db
          MINIO_URL: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadminpassword
        run: sh mvnw -B verify

      - name: Rapports de test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rapports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 5

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Backend"
            echo
            echo "| Mesure | Valeur |"
            echo "|---|---|"
            if [ -d target/surefire-reports ]; then
              somme() { grep -ho "$1=\"[0-9]*\"" target/surefire-reports/*.xml \
                | grep -o '[0-9]*' | awk '{t+=$1} END {print t+0}'; }
              echo "| Tests | $(somme tests) |"
              echo "| Échecs | $(somme failures) |"
              echo "| Erreurs | $(somme errors) |"
            fi
            [ -f target/*.jar ] && echo "| Jar | $(du -sh target/*.jar | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY" || true

  # ── Analyse statique ───────────────────────────────────────────────────────────────────
  # Séparée de la qualité pour que l'absence de jeton SonarCloud — sur un fork, par exemple —
  # ne fasse pas tomber tout le pipeline.
  #
  # Sautée sur un tag : SonarCloud voit `refs/tags/v1.0.0` comme une branche éphémère, que la
  # formule gratuite refuse, et le job échoue sur un « Not authorized ». Il n'y aurait de
  # toute façon rien à apprendre — le commit étiqueté a déjà été analysé sur `develop`.
  sonar:
    name: SonarCloud
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{ !startsWith(github.ref, 'refs/tags/')
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rapports
          path: target

      # La distribution Maven que le wrapper télécharge n'est pas dans le cache de
      # `setup-java`, qui ne garde que `~/.m2/repository`. Sans ce cache, chaque job la
      # retire du réseau — et un pipeline qui tombe sur un aléa de téléchargement est un
      # pipeline qu'on finit par relancer sans lire.
      - name: Cache de la distribution Maven
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      # Première invocation, isolée et réessayée : elle ne fait que provoquer le
      # téléchargement. Le vrai travail part ensuite avec la distribution déjà en place.
      - name: Amorçage du wrapper
        run: |
          for tentative in 1 2 3; do
            if sh mvnw -B -N -q validate; then exit 0; fi
            echo "tentative $tentative échouée, nouvelle tentative dans 15 s"
            sleep 15
          done
          echo "le wrapper Maven n'a pas pu récupérer sa distribution"
          exit 1

      # Le scanner Maven plutôt que l'action générique : il lit le POM, connaît donc les
      # chemins de compilation et n'a pas besoin qu'on les lui répète.
      # La clé de projet, l'organisation et l'URL sont dans le POM : le scanner Maven ne
      # lit pas `sonar-project.properties`, contrairement au scanner générique.
      - name: Analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          sh mvnw -B -DskipTests
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

  # ── Dépendances ────────────────────────────────────────────────────────────────────────
  dependances:
    name: Vulnérabilités des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Trivy en mode système de fichiers lit le `pom.xml` et compare aux avis publiés : pas
      # de compilation, pas de base de vulnérabilités à entretenir soi-même.
      - name: Trivy sur les dépendances
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # ── Image ──────────────────────────────────────────────────────────────────────────────
  image:
    name: Image Docker
    needs: [qualite, dependances]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=gestion-stock-backend
            org.opencontainers.image.description=API Spring Boot de gestion-stock

      - name: Connexion à Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_NAMESPACE || 'mcjordan12' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # L'image est construite et analysée à chaque push et à chaque pull request : c'est ce
      # qui garantit que le Dockerfile tient et que le socle reste sain. Elle n'est publiée
      # que sur un tag — une version qu'on a décidé de livrer, pas un état de branche.
      #
      # Le build local mono-architecture sert au scan ; le multi-architecture ne part
      # qu'ensuite, une fois Trivy passé.
      - name: Construction pour analyse
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: analyse:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: analyse:local
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Remontée dans l'onglet sécurité
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Échec sur vulnérabilité corrigeable
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: analyse:local
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Construction multi-architecture et publication
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Image backend"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
