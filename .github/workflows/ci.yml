# Intégration et livraison continues du backend.
#
# Trois temps : on vérifie, on analyse, on publie. Rien n'est publié qui n'ait passé les deux
# premiers — `needs` l'impose, et la publication ne se déclenche que sur les références qui
# désignent quelque chose de déployable.

name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Un push qui en remplace un autre sur la même référence annule le précédent. Une exception
# pour les tags, dont l'annulation laisserait une version sans image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || 'mcjordan12' }}/gestion-stock-backend

jobs:
  # ── Qualité ────────────────────────────────────────────────────────────────────────────
  qualite:
    name: Compilation, tests, couverture
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL est démarré même si la suite actuelle est unitaire : le jour où un test
    # d'intégration arrive, il trouve une base sans qu'on retouche au pipeline. Le port est
    # celui de l'application, pas le 5433 du compose de développement.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gestion_stock_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud a besoin de l'historique complet pour attribuer les lignes neuves à
          # leur commit ; une copie superficielle lui ferait voir tout le dépôt comme neuf.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` couvre `test` puis déclenche le rapport JaCoCo, attaché à cette phase.
      - name: Vérification et couverture
        env:
          DB_URL: jdbc:postgresql://localhost:5432/gestion_stock_db
        run: sh mvnw -B verify

      - name: Rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 5

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Backend"
            echo
            echo "| Mesure | Valeur |"
            echo "|---|---|"
            if [ -d target/surefire-reports ]; then
              somme() { grep -ho "$1=\"[0-9]*\"" target/surefire-reports/*.xml \
                | grep -o '[0-9]*' | awk '{t+=$1} END {print t+0}'; }
              echo "| Tests | $(somme tests) |"
              echo "| Échecs | $(somme failures) |"
              echo "| Erreurs | $(somme errors) |"
            fi
            [ -f target/*.jar ] && echo "| Jar | $(du -sh target/*.jar | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY" || true

  # ── Analyse statique ───────────────────────────────────────────────────────────────────
  # Séparée de la qualité pour que l'absence de jeton SonarCloud — sur un fork, par exemple —
  # ne fasse pas tomber tout le pipeline.
  sonar:
    name: SonarCloud
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: rapports
          path: target

      # Le scanner Maven plutôt que l'action générique : il lit le POM, connaît donc les
      # chemins de compilation et n'a pas besoin qu'on les lui répète.
      - name: Analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          sh mvnw -B -DskipTests
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io

  # ── Dépendances ────────────────────────────────────────────────────────────────────────
  dependances:
    name: Vulnérabilités des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Trivy en mode système de fichiers lit le `pom.xml` et compare aux avis publiés : pas
      # de compilation, pas de base de vulnérabilités à entretenir soi-même.
      - name: Trivy sur les dépendances
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # ── Image ──────────────────────────────────────────────────────────────────────────────
  image:
    name: Image Docker
    needs: [qualite, dependances]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=gestion-stock-backend
            org.opencontainers.image.description=API Spring Boot de gestion-stock

      - name: Connexion à Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_NAMESPACE || 'mcjordan12' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # L'image est d'abord construite pour la seule architecture de l'exécuteur et chargée
      # localement : c'est celle que Trivy inspecte. Le build multi-architecture ne part
      # qu'ensuite, une fois le scan passé.
      - name: Construction pour analyse
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: analyse:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: analyse:local
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Remontée dans l'onglet sécurité
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Échec sur vulnérabilité corrigeable
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: analyse:local
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Construction multi-architecture et publication
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Image backend"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
