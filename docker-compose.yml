version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gestion_stock_db
    environment:
      POSTGRES_DB: gestion_stock_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: gestion_stock_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9005:9000"
      - "9006:9001"
    volumes:
      - miniodata:/data

  # Serveur SMTP factice pour le développement:
  # capture tous les emails sortants sans jamais les délivrer réellement. Interface web de
  # consultation sur http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.15
    container_name: gestion_stock_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # Port SMTP
      - "8025:8025"  # Port UI Web
    volumes:
      - maildata:/data
    environment:
      MP_DATABASE_PATH: /data/mailpit.db
volumes:
  pgdata:
  miniodata:
  maildata: