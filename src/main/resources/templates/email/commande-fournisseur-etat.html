<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Mise à jour de commande</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family: Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
                <tr>
                    <td style="background-color:#1f6feb; padding:20px 32px;">
                        <h1 style="color:#ffffff; font-size:20px; margin:0;">Mise à jour de votre commande</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <p style="font-size:15px; color:#1a1a1a;">
                            Bonjour <span th:text="${fournisseurPrenom} + ' ' + ${fournisseurNom}">Fournisseur</span>,
                        </p>
                        <p th:if="${etatCommande == 'LIVREE'}" style="font-size:15px; color:#1a1a1a;">
                            La commande <strong th:text="${codeCommande}">CF-2026-0001</strong> a été marquée comme livrée.
                        </p>
                        <p th:if="${etatCommande == 'ANNULEE'}" style="font-size:15px; color:#1a1a1a;">
                            La commande <strong th:text="${codeCommande}">CF-2026-0001</strong> a été annulée.
                        </p>
                        <p style="font-size:14px; color:#555; margin-top:24px;">
                            Merci de votre confiance.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="background-color:#f4f4f7; padding:16px 32px; font-size:12px; color:#888;">
                        Cet email a été généré automatiquement, merci de ne pas y répondre.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
