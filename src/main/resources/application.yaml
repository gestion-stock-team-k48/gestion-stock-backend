server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: gestion-stock-backend

  # ── Configuration Base de données PostgreSQL ──
  datasource:
    url: jdbc:postgresql://localhost:5433/gestion_stock_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  # ── Configuration JPA / Hibernate ─────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Configuration Limites Téléversement Fichiers ──
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ── Configuration MinIO ─────────────────────────
minio:
  url: http://localhost:9005
  access-key: minioadmin
  secret-key: minioadminpassword
  bucket-name: gestion-stock-bucket

# ── Configuration JWT ───────────────────────────
application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 # 1 jour en millisecondes
      refresh-token:
        expiration: 604800000 # 7 jours en millisecondes

# ── Configuration Swagger / OpenAPI ─────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html