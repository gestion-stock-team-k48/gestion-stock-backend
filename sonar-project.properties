# Analyse SonarCloud du backend.
#
# Les chemins de sources et de classes ne sont pas répétés : le scanner Maven les lit du POM.

sonar.projectKey=gestion-stock-team-k48_gestion-stock-backend
sonar.organization=gestion-stock-team-k48

# Le code produit par MapStruct et Lombok est régénéré à chaque compilation : l'analyser
# reviendrait à relever des défauts que personne ne peut corriger.
sonar.exclusions=**/target/**,**/generated/**,**/dto/**Mapper*.java

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

sonar.sourceEncoding=UTF-8
